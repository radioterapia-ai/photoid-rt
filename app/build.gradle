plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp' version '1.9.20-1.0.14'
}

android {
    namespace 'com.radioterapia.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.radioterapia.ai"
        minSdk 24
        targetSdk 34
        versionCode 28
        versionName "4.3"
        vectorDrawables.useSupportLibrary = true
    }

    /*
        ASSINATURA DE RELEASE.

        O caminho vem da variavel de ambiente PHOTOID_RT_KEYSTORE, que aponta um
        .properties fora do projeto. Duas razoes, e as duas ja morderam alguem:

        1. C:\AI_PROJETOS e C:\AI_DEPLOY sincronizam com o Drive, e .gitignore
           protege o Git mas NAO protege a sincronizacao. Chave de assinatura em
           nuvem pessoal e o pior caso deste projeto: quem a tem publica uma
           atualizacao maliciosa assinada como o autor, e o Android instala por
           cima sem uma pergunta.
        2. Caminho absoluto nao entra no codigo (regra do ecossistema).

        SEM A VARIAVEL o build NAO QUEBRA: cai no debug, que e o que um clone do
        repositorio publico deve fazer. Quem clona nao tem a chave e nao deve
        precisar dela para compilar.
    */
    // A PROPRIEDADE VEM PRIMEIRO. `System.getenv()` aqui le o ambiente do daemon
    // do Gradle, que ja esta em execucao e nao herda variavel criada depois de
    // ele subir — um release chegou a sair sem assinatura por causa disso, e o
    // build nao reclamou. Propriedade do Gradle chega ao daemon sempre; a
    // variavel de ambiente fica como alternativa para CI e outras maquinas.
    def arqChave = project.findProperty('photoidKeystore') ?: System.getenv('PHOTOID_RT_KEYSTORE')
    def propChave = new Properties()
    def temChave = false
    if (arqChave != null && !arqChave.isEmpty() && file(arqChave).exists()) {
        file(arqChave).withInputStream { propChave.load(it) }
        temChave = propChave['storeFile'] != null && file(propChave['storeFile']).exists()
    }

    signingConfigs {
        if (temChave) {
            release {
                storeFile file(propChave['storeFile'])
                storePassword propChave['storePassword']
                keyAlias propChave['keyAlias']
                keyPassword propChave['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Assina so quando a chave esta disponivel. Release sem assinatura
            // sai como -unsigned, que e visivel — melhor que sair assinado em
            // debug parecendo pronto para distribuir.
            if (temChave) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }

    // MELHORIA: portão de qualidade. Regressões que já nos custaram builds
    // (string sem tradução, texto fixo no layout, recurso ausente) passam a
    // quebrar o build em vez de chegar ao tablet.
    lint {
        warningsAsErrors false
        abortOnError true
        // ERRO: o que já quebrou build/tela em campo.
        error 'MissingTranslation', 'MissingDefaultResource', 'ExtraTranslation'
        // AVISO: restam siglas e IPs de exemplo nos layouts (aceitáveis).
        warning 'HardcodedText'
        // UnusedResources ficava DESLIGADO como "ruído aceito". Não era ruído:
        // com ele ligado apareceram 6 layouts órfãos e 85 strings mortas — e um
        // deles, group_csv_database.xml, mantinha vivo um bind que APAGAVA a
        // configuração do CSV a cada salvamento das Configurações. Fica ligado.
        // Como `warningsAsErrors` é false, ele avisa sem quebrar o build.
        disable 'GoogleAppIndexingWarning', 'IconMissingDensityFolder'
        checkReleaseBuilds true
        textReport true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    packagingOptions {
        resources {
            // NOTICE e LICENSE são MESCLADOS, não excluídos.
            //
            // Estavam em `excludes`, provavelmente para resolver conflito de
            // arquivos duplicados no merge do APK — solução comum e errada. A
            // Apache-2.0, seção 4(d), exige que trabalhos derivados
            // distribuídos preservem os avisos de atribuição do NOTICE quando
            // ele existe. Excluí-los descumpre a licença que nos permite usar
            // AndroidX, CameraX, Room, Material, coroutines, SMBJ, ZXing e
            // OpenCSV.
            //
            // `merges` concatena as cópias em vez de escolher uma, que é
            // exatamente o que "preservar os avisos" significa quando há várias.
            merges += ['META-INF/NOTICE', 'META-INF/NOTICE.txt',
                       'META-INF/LICENSE', 'META-INF/LICENSE.txt']
            // DEPENDENCIES é gerado pelo Maven e não carrega aviso de
            // copyright; continua fora.
            excludes += ['META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    // Testes unitários (JVM, sem device) — ver app/src/test/
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // CameraX (vai ser usado em E2 mas já incluo)
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // ML Kit (E3 - barcode + OCR)
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'
    // Scanner de documentos (Scan de Impressos): detecção de bordas + perspectiva
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // SMB
    implementation 'com.hierynomus:smbj:0.13.0'

    // Senha criptografada
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Glide para imagens
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Room (preparação para E3 - cache CSV)
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    // ZXing para QR (E5)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // OpenCSV (E3)
    implementation 'com.opencsv:opencsv:5.9'

    /*
        MOTOR DE SINCRONIZACAO (v4.0).

        As tres bibliotecas abaixo existem porque o app passou a levar os
        arquivos ao servidor por conta propria, em vez de depender de um
        aplicativo externo. Cada uma cobre um protocolo que alguma clinica ja
        tem de pe — nenhuma delas e alternativa das outras.

        WORKMANAGER: a fila que sobrevive ao tablet ser reiniciado no meio do
        turno. Sem ele, "sincronizar depois" seria uma promessa que o Android
        quebra a primeira vez que mata o processo.

        COMMONS-NET: FTP e FTPS. E a biblioteca de FTP em Java que nao precisa
        de nada do lado do servidor, e servico antigo costuma ter so FTP.

        JSCH (fork mantido do mwiede): SFTP. O original parou em 2018 e nao
        negocia os algoritmos que servidor OpenSSH atual exige — conexao que
        falha com "Algorithm negotiation fail", que nao parece problema de
        biblioteca velha.

        WEBDAV NAO TEM BIBLIOTECA: e HTTP com dois verbos a mais (PUT e MKCOL),
        e o HttpURLConnection da plataforma faz os dois. Acrescentar dependencia
        para isso seria peso sem retorno.

        SAF tambem nao tem: DocumentFile ja esta aqui.
    */
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'commons-net:commons-net:3.10.0'
    implementation 'com.github.mwiede:jsch:0.2.17'
}
